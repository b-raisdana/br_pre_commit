[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast isolated unit tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.ipynb", ".*venv", "archive_not_used_trash"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
disallow_any_explicit = true
no_implicit_optional = true
warn_return_any = true
ignore_missing_imports = true
follow_imports = "silent"
# archive_not_used_trash/ holds unreachable-from-presentation code kept for reference, not linted -
# see app/archive_not_used_trash/README.md.
exclude = "(^|/)archive_not_used_trash/"
