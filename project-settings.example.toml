# Copy this file to <project>/.br-pre-commit.toml and uncomment only overrides.

# [wrapper]
# unknown-hook-policy = "warn"     # "error" is the shared default
# job-timeout-seconds = 1200        # 900 is the shared default
# protected-branches = ["main", "master"]  # ["main"] is the shared default; [] disables this guard

# [ratchet]
# target = "src"                   # "app" is the shared default
# max-lines = 300                   # 300 is the shared default
# line-growth-slack = 5            # 5 is the shared default
# complexity-ranks = "ABCDEF"       # "ABCDEF" is the shared default
# xenon-max-absolute = "B"          # "B" is the shared default
