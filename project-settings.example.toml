# Copy this file from .tools/br_pre_commit/ to <project>/.br-pre-commit.toml and uncomment only overrides.

# [wrapper]
# unknown-hook-policy = "warn"     # "error" is the shared default
# job-timeout-seconds = 1200        # 900 is the shared default
# protected-branches = ["main", "master"]  # ["main"] is the shared default; [] disables this guard

# [ratchet]
# target = "src"                   # "app" is the shared default
# max-lines = 600                   # 500 is the shared default
# line-growth-slack = 10            # 5 is the shared default
# complexity-ranks = "CDEF"         # "ABCDEF" is the shared default
