# Shared defaults. A project's .br-pre-commit.toml may override any value.
# See README.md § "Recognized hook IDs" for the list of hook IDs the wrapper
# can classify; unrecognized IDs trigger an error under the policy below.
[wrapper]
unknown-hook-policy = "error"
job-timeout-seconds = 900
protected-branches = ["main"]

[ratchet]
target = "app"
max-lines = 300
line-growth-slack = 5
complexity-ranks = "ABCDEF"
xenon-max-absolute = "B"
# Directory excluded from ratchet/ruff/mypy/xenon scans. Unreachable-from-presentation
# reference code kept for reference, not linted - see <repo>/<exclude-dir>/README.md.
exclude-dir = "archive_not_used_trash"

[backup]
# Directory whose files are excluded from patch backups (they are backed up as full
# file copies under logs/pre-commit/full_backup/ instead). Unreachable-from-presentation
# reference code kept for reference, not linted - see <repo>/<exclude-dir>/README.md.
exclude-dir = "^(data|logs|\\.[^/]+)$"
