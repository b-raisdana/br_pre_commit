ci:
  autofix_commits: true
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest unit gate
        language: system
        entry: python -m pytest -q -m unit
        pass_filenames: false
        files: ^(src/.*\.py|tests/.*\.py|pyproject\.toml)$

  - repo: local
    hooks:
      - id: incremental-ratchet
        name: incremental ratchet (mypy/ruff/xenon/loc - blocks regressions only, see README)
        language: system
        entry: python -m ratchet
        pass_filenames: false
        files: ^app/.*\.py$

      - id: pytest-fast
        name: pytest unit gate
        language: system
        entry: python -m pytest -m unit
        pass_filenames: false
        files: ^(app/.*\.py|pytest\.ini)$

      - id: pytest-integration-collect
        name: pytest integration collection check
        language: system
        entry: python -m pytest --collect-only -m integration tests/integration
        pass_filenames: false
        files: ^tests/integration/.*\.py$

      - id: integration-tests
        name: Run modified integration tests
        language: system
        entry: python -m pytest -q -m integration
        pass_filenames: true
        files: ^tests/integration/.*\.py$

      - id: check-pandera-decorator
        name: check pandera_validate decorator
        language: system
        entry: python -m check_pandera_decorator.py
        pass_filenames: true
        files: ^app/.*\.py$

      - id: sync-skill-files
        name: sync mirrored skill files (claude/codex/devin/qoder/copilot/kiro/kilo bidirectional mirrors)
        language: system
        entry: python -m sync_skills
        pass_filenames: false
        files: ^(\.claude/skills/[^/]+/SKILL\.md|\.codex/skills/[^/]+/SKILL\.md|\.devin/skills/[^/]+/SKILL\.md|\.qoder/skills/[^/]+/SKILL\.md|\.copilot/skills/[^/]+/SKILL\.md|\.kiro/skills/[^/]+/SKILL\.md|\.kilo/skills/[^/]+/SKILL\.md|\.github/git-commit/SKILL\.md)$
